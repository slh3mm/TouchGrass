services:
  web:
    #build: ./frontend/
    image: ghcr.io/seanmorley15/adventurelog-frontend:latest
    container_name: adventurelog-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-8015}:3000"
    depends_on:
      - server

  db:
    image: postgis/postgis:16-3.5
    container_name: adventurelog-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  server:
    #build: ./backend/
    image: ghcr.io/seanmorley15/adventurelog-backend:latest
    container_name: adventurelog-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8016}:80"
    depends_on:
      - db
    volumes:
      - adventurelog_media:/code/media/
      # Cross-platform empty fallback. A host photo source must be opted into
      # explicitly and is always mounted read-only.
      - "${ICLOUD_PHOTOS_ROOT:-./.local/icloud-photos}:/icloud-photos:ro"
      - photo_preview_cache:/code/photo-previews/

volumes:
  postgres_data:
  adventurelog_media:
  photo_preview_cache:
