services:
  web:
    build:
      context: ./frontend/
      target: build
    image: ghcr.io/seanmorley15/adventurelog-frontend:latest
    container_name: adventurelog-frontend
    restart: unless-stopped
    stop_grace_period: 10s
    user: root
    entrypoint: []
    env_file: .env
    environment:
      - CI=true
      - NODE_OPTIONS=--max-old-space-size=2048
      # This repository lives under a Windows/OneDrive path. Native file events can
      # be dropped across the Docker bind mount, leaving Vite's module graph stale.
      - CHOKIDAR_USEPOLLING=${VITE_USE_POLLING:-true}
      - CHOKIDAR_INTERVAL=${VITE_POLLING_INTERVAL:-1200}
      - VITE_POLLING_INTERVAL=${VITE_POLLING_INTERVAL:-1200}
    ports:
      - "${FRONTEND_PORT:-8015}:3000"
    depends_on:
      - server
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    # `exec` makes Vite PID 1 after setup so Docker restart/stop signals reach it
    # directly and Compose can report the lifecycle transition correctly.
    command: >
      sh -c "mkdir -p /pnpm-store &&
      pnpm config set store-dir /pnpm-store &&
      if [ ! -f /app/node_modules/.touchgrass-lockfile ] || ! cmp -s /app/pnpm-lock.yaml /app/node_modules/.touchgrass-lockfile; then
        pnpm install --frozen-lockfile && cp /app/pnpm-lock.yaml /app/node_modules/.touchgrass-lockfile;
      fi &&
      exec pnpm exec vite dev --host 0.0.0.0 --port 3000 --strictPort"

  db:
    image: postgis/postgis:16-3.5
    container_name: adventurelog-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  server:
    build: ./backend/
    image: ghcr.io/seanmorley15/adventurelog-backend:latest
    container_name: adventurelog-backend
    restart: unless-stopped
    # The source bind mount replaces /code, including the production image's
    # /code/entrypoint.sh. Development initialization is handled by command below.
    entrypoint: []
    env_file: .env
    environment:
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_ADMIN_USERNAME}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_ADMIN_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_ADMIN_EMAIL}
    ports:
      - "${BACKEND_PORT:-8016}:8000"
    depends_on:
      - db
    volumes:
      - ./backend/server:/code
      - adventurelog_media:/code/media/
      # Cross-platform empty fallback. Windows installations that run the poller
      # override this in .env with the real iCloud Photos folder.
      - "${ICLOUD_PHOTOS_ROOT:-./.local/icloud-photos}:/icloud-photos:ro"
      - photo_preview_cache:/code/photo-previews/
    command: >
      sh -c "memcached -u nobody -m 64 -p 11211 -d;
      until pg_isready -h db -p 5432 >/dev/null 2>&1; do sleep 1; done;
      python manage.py migrate --noinput;
      python manage.py shell -c \"from worldtravel.models import Country; import sys; sys.exit(0 if Country.objects.exists() else 1)\" || python manage.py download-countries;
      if [ -n \"$$DJANGO_SUPERUSER_USERNAME\" ] && [ -n \"$$DJANGO_SUPERUSER_PASSWORD\" ] && [ -n \"$$DJANGO_SUPERUSER_EMAIL\" ]; then
        python manage.py createsuperuser --noinput --username \"$$DJANGO_SUPERUSER_USERNAME\" --email \"$$DJANGO_SUPERUSER_EMAIL\" || true;
      fi;
      python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
  adventurelog_media:
  frontend_node_modules:
  pnpm_store:
  photo_preview_cache:
